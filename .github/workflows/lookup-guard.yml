# The performance gates.
#
# Nothing here is timed. What gates is machine code, struct sizes and exact
# operation counts, all of them integers. Every gate compares this revision
# against a base revision built in the same job with the same compiler, so
# upgrading a runner image moves both sides at once.
#
# On a pull request the base is the merge base. On a push it is the event's
# predecessor, and the commit has already landed, so a push-triggered run
# reports rather than gates. Where there is no predecessor the gate says so and
# does not report a measurement it did not take.
name: lookup-guard

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base:
        description: revision to compare against
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: lookup-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  # The scripts read these; the workflow's only job is to fill them in from the
  # event payload. Keep the logic in tests/ci, not here.
  #
  # The base differs per event and there is no default: a base that falls
  # through to the current revision makes every gate compare the revision
  # against itself and pass.
  FPH_CI_BASE_REF: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
     || github.event_name == 'push' && github.event.before
     || inputs.base }}
  # The JSON array, so a label is matched whole rather than as a substring of a
  # longer one.
  FPH_CI_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

jobs:
  # Does the lookup path's machine code change? Identical passes; anything else
  # fails, in either direction. Overridable with the allow-lookup-asm-change
  # label.
  lookup-asm:
    name: lookup asm ${{ matrix.os }} ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: ubuntu-24.04
            cxx: clang++
          - os: macos-15
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tests/ci/check-asm.sh --cxx ${{ matrix.cxx }}

  # Exact sizes of every container, against the recorded baseline. Both growing
  # and shrinking fail; update tests/ci/baselines/sizeof.txt on purpose.
  container-sizeof:
    name: sizeof ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tests/ci/check-sizeof.sh

  # Allocations, bytes, peak footprint, key copies/moves and the table geometry
  # for fixed workloads, as upper bounds. An improvement passes with no baseline
  # edit. Overridable with the allow-construction-cost-increase label.
  construction-cost:
    name: counters ${{ matrix.os }} ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: macos-15
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: tests/ci/check-counters.sh --cxx ${{ matrix.cxx }}

  # Instructions executed and simulated D1 misses for the lookup loop itself.
  # Catches what the asm gate structurally cannot: a runtime parameter or a
  # different chosen geometry, which leave the machine code byte-identical.
  # Linux only -- valgrind has no macOS arm64 port.
  # Overridable with the allow-lookup-cost-increase label.
  lookup-cost:
    name: callgrind ubuntu-24.04 ${{ matrix.cxx }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: tests/ci/check-callgrind.sh --cxx ${{ matrix.cxx }}
